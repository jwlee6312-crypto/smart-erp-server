services:
  smartdb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: smartdb
    environment: 
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Crmbank123!"
      TZ: "Asia/Seoul"
    ports: ["1434:1433"]
    volumes:
      - /data/smart-erp/mssql:/var/opt/mssql
      - /etc/localtime:/etc/localtime:ro # 🚀 [해결] 호스트 시계를 컨테이너와 동기화
      - /etc/timezone:/etc/timezone:ro
    restart: always

  asterisk-db:
    image: mysql:8.0
    container_name: asterisk-db
    environment: 
      - MYSQL_ROOT_PASSWORD=Crmbank123!
      - MYSQL_DATABASE=asterisk
      - TZ=Asia/Seoul
    ports: ["3307:3306"]
    volumes:
      - /data/smart-erp/mysql:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro # 🚀 [해결] 호스트 시계를 컨테이너와 동기화
      - /etc/timezone:/etc/timezone:ro
    restart: always

  asterisk:
    image: andrius/asterisk:16
    container_name: asterisk
    environment:
      - ODBCINI=/etc/odbc.ini
      - ODBCSYSINI=/etc
      - TZ=Asia/Seoul # 🚀 시간대 추가
    ports: ["5038:5038", "5060:5060/udp", "10000-10100:10000-10100/udp"]
    volumes:
      - ./asterisk_config:/etc/asterisk
      - /var/lib/asterisk/sounds/custom:/var/lib/asterisk/sounds/custom:rw
      - /data/smart-erp/recordings:/var/spool/asterisk/monitor:rw
      - ./asterisk_config/odbc.ini:/etc/odbc.ini
      - ./asterisk_config/odbcinst.ini:/etc/odbcinst.ini
      - /usr/lib/x86_64-linux-gnu/odbc:/usr/lib/x86_64-linux-gnu/odbc:ro
      - /usr/lib/x86_64-linux-gnu/libssl.so.1.1:/usr/lib/x86_64-linux-gnu/libssl.so.1.1:ro
      - /usr/lib/x86_64-linux-gnu/libcrypto.so.1.1:/usr/lib/x86_64-linux-gnu/libcrypto.so.1.1:ro
    depends_on:
      - asterisk-db
    restart: always

  backend:
    build:
      context: .
      dockerfile: ./k8s-deploy/backend/Dockerfile
    image: smart-erp-backend:latest
    container_name: backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=chatwoot-redis
      - SPRING_DATA_REDIS_PORT=6379
      - ERP_DB_HOST=smartdb
      - ASTERISK_DB_HOST=asterisk-db
      # 🚀 [해결 핵심] 누락되었던 교환기 접속 정보 강제 주입
      - ASTERISK_HOST=asterisk
      - ASTERISK_PORT=5038
      - ASTERISK_USERNAME=admin
      - ASTERISK_PASSWORD=Crmbank123!
      - SECURITY_USERNAME=admin
      - SECURITY_PASSWORD=Crmbank123!
    ports: ["8080:8080"]
    volumes: 
      - /data/smart-erp/storage:/app/storage
      - /var/lib/asterisk/sounds/custom:/var/lib/asterisk/sounds/custom:rw
      - /data/smart-erp/recordings:/var/spool/asterisk/monitor:ro
    depends_on: [smartdb, asterisk-db, chatwoot-redis]
    restart: always

  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
    image: smart-erp-frontend:latest
    container_name: frontend
    ports: ["80:80"]
    volumes:
      - ./nginx_config/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/asterisk/sounds/custom:/var/lib/asterisk/sounds/custom:ro # 🚀 [추가] ARS 음원 직접 배달용
      - /data/smart-erp/recordings:/data/smart-erp/recordings:ro # 🚀 [추가] 녹취 파일 직접 배달용
    depends_on: [backend]
    restart: always

  chatwoot-postgres: { image: pgvector/pgvector:pg12, container_name: chatwoot-postgres, environment: { POSTGRES_DB: chatwoot, POSTGRES_USER: chatwoot, POSTGRES_PASSWORD: "Crmbank123!" }, volumes: ["/data/smart-erp/chatwoot/postgres:/var/lib/postgresql/data"], restart: always }
  chatwoot-redis: { image: redis:6-alpine, container_name: chatwoot-redis, ports: ["6379:6379"], restart: always }
  chatwoot-web: { image: chatwoot/chatwoot:latest, container_name: chatwoot-web, command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"], environment: { FRONTEND_URL: "http://172.30.1.11:3000", REDIS_URL: "redis://chatwoot-redis:6379/0", POSTGRES_HOST: chatwoot-postgres, POSTGRES_DATABASE: chatwoot, POSTGRES_USERNAME: chatwoot, POSTGRES_PASSWORD: "Crmbank123!", RAILS_ENV: production, SECRET_KEY_BASE: 7ba8ef8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e }, ports: ["3000:3000"], depends_on: [chatwoot-postgres, chatwoot-redis], restart: always }
  chatwoot-worker: { image: chatwoot/chatwoot:latest, container_name: chatwoot-worker, command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"], environment: { REDIS_URL: "redis://chatwoot-redis:6379/0", POSTGRES_HOST: chatwoot-postgres, POSTGRES_DATABASE: chatwoot, POSTGRES_USERNAME: chatwoot, POSTGRES_PASSWORD: "Crmbank123!", RAILS_ENV: production }, depends_on: [chatwoot-postgres, chatwoot-redis], restart: always }

networks:
  default:
    name: erp-network
