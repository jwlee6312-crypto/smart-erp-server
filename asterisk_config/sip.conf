[general]
context=from-internal
bindport=5060
bindaddr=0.0.0.0
transport=udp
externaddr=172.30.1.11:5060
localnet=172.18.0.0/255.255.0.0

nat=force_rport,comedia
directmedia=no
dtmfmode=rfc2833
relaxdtmf=yes
qualify=yes

; 🚀 모든 전화기 설정에 DTMF 방식을 개별적으로 명시 (성공 보장)
