server {
    listen 80;
    server_name localhost;

    # 🚀 [해결 1] 상자를 3초 안에 띄우기 위한 MIME 타입 강제 명시
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        image/png                             png;
        application/json                      json;
    }

    root /usr/share/nginx/html;
    index index.html;

    # 🚀 1. 로그인 화면 서비스
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 🚀 2. [해결 2] 헤매는 시간 0초를 위한 내부 IP 직결 통로
    location /api/ {
        proxy_pass http://172.18.0.7:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
    }

    # 🚀 3. 소리 재생 헤더 세탁
    location /api/crm/inbound/play-recording {
        proxy_pass http://172.18.0.7:8080/api/crm/inbound/play-recording;
        proxy_hide_header Content-Type;
        add_header Content-Type audio/wav;
        proxy_set_header Host $host;
    }
}
